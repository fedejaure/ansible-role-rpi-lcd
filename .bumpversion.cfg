[bumpversion]
commit = True
tag = True
current_version = 0.4.1
tag_name = "{new_version}"

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(title):CHANGELOG.md]
search = {#}{#} [Unreleased]
replace = {#}{#} [Unreleased]
	
	{#}{#} [{new_version}] - {now:%Y-%m-%d}

[bumpversion:file(links):CHANGELOG.md]
search = [Unreleased]: https://github.com/fedejaure/ansible-role-rpi-lcd/compare/{current_version}...main
replace = [Unreleased]: https://github.com/fedejaure/ansible-role-rpi-lcd/compare/{new_version}...main
	[{new_version}]: https://github.com/fedejaure/ansible-role-rpi-lcd/compare/{current_version}...{new_version}
