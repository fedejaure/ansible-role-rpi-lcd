name: tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  ROLE_NAME: fedejaure.rpi_lcd
jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Install system deps
        shell: bash
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --no-root --only dev --sync

      - name: Linting
        shell: bash
        run: poetry run inv hooks

  tests:
    needs: linting
    name: molecule-${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - debian11
          - debian12
          - ubuntu2204
          - ubuntu2404
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          path: "${{ env.ROLE_NAME }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: './${{ env.ROLE_NAME }}/.python-version'

      - name: Install system deps
        working-directory: "./${{ env.ROLE_NAME }}"
        shell: bash
        run: |
          pip install poetry
          poetry config virtualenvs.in-project true
          poetry install --no-root

      - name: Install playbooks requirements
        working-directory: "./${{ env.ROLE_NAME }}"
        shell: bash
        run: poetry run inv galaxy-install

      - name: Run security check
        working-directory: "./${{ env.ROLE_NAME }}"
        shell: bash
        run: poetry run inv security

      - name: Run Molecule tests
        working-directory: "./${{ env.ROLE_NAME }}"
        run: poetry run inv tests
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}
